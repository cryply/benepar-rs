[package]
name = "benepar-rs"
version = "0.1.0"
edition = "2024"
description = "Constituency parser: benepar_en3 inference in Rust, with k-best trees"
license = "MIT"
repository = "https://github.com/cryply/benepar-rs"
readme = "README.md"
keywords = ["nlp", "parser", "constituency", "benepar", "t5"]

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
clap = { version = "4.6.9", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_plain = "1.0.2"
tokenizers = "0.23.2"
tracing = "0.1.44"

[dev-dependencies]
ureq = { version = "3", features = ["json"] }
